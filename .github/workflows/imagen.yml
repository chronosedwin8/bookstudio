# Construye la imagen de BookStudio y la publica en el registro de GitHub.
#
# Por que existe: el servidor de produccion va muy justo de memoria y compilar
# alli colgaba el despliegue sin dar ningun error, a veces durante 40 minutos,
# con el contenedor viejo sirviendo mientras tanto. Aqui la maquina tiene memoria
# de sobra, asi que Coolify pasa de construir a solo descargar una imagen ya
# hecha, que tarda segundos.
#
# La imagen no lleva ningun secreto dentro: las variables de entorno se las pone
# Coolify al arrancar el contenedor, no se hornean aqui.

name: Imagen de produccion

on:
  push:
    branches: [main]
    # Los cambios que no entran en la imagen no gastan una construccion.
    paths-ignore:
      - '**.md'
      - 'scripts/**'
      - '.env.example'
  # Para reconstruir a mano sin tener que tocar el codigo.
  workflow_dispatch:

concurrency:
  # Dos entregas seguidas: se abandona la primera, que ya no se va a desplegar.
  group: imagen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar al registro de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token que da GitHub a la propia ejecucion; no hay que guardar nada.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombres de la imagen
        id: nombres
        run: |
          # En minusculas: el registro rechaza mayusculas en el nombre.
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Dos etiquetas: "latest" para lo comodo y la del commit para saber
          # exactamente que hay corriendo y poder volver atras.
          tags: |
            ghcr.io/${{ steps.nombres.outputs.repo }}:latest
            ghcr.io/${{ steps.nombres.outputs.repo }}:${{ steps.nombres.outputs.sha }}
          # Cache entre ejecuciones: sin esto cada entrega reinstala npm entero.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo '```'
            echo "ghcr.io/${{ steps.nombres.outputs.repo }}:${{ steps.nombres.outputs.sha }}"
            echo "ghcr.io/${{ steps.nombres.outputs.repo }}:latest"
            echo '```'
            echo ""
            echo "Para desplegarla, poner BOOKSTUDIO_IMAGE en Coolify con la etiqueta del commit."
          } >> "$GITHUB_STEP_SUMMARY"
